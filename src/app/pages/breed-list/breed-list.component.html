<h1 class="text-4xl mb-2 font-extrabold tracking-tight text-gray-900 sm:text-5xl md:text-4xl lg:text-5xl xl:text-6xl">
  <span class="block xl:inline">Lista de </span>
  <span data-primary="indigo-600" class="block text-cyan-600 xl:inline">Actividades</span>
</h1>

<p class="text-base text-gray-500 sm:max-w-md lg:text-xl md:max-w-3xl">Si estas interesado en alguna actividad elige y sigue las instrucciones.</p>

<section class="py-12 bg-gray-100 rounded-2xl shadow-lg">
  <div class="max-w-6xl mx-auto px-4 grid gap-10 md:grid-cols-1">
    <div *ngFor="let game of games" class="flex flex-col md:flex-row items-center bg-white rounded-xl shadow-md overflow-hidden">
      
      <!-- Left section (Text + Button + Description) -->
      <div class="p-6 flex-1 text-center md:text-left">
        <h3 class="text-xl font-semibold text-gray-800 mb-2">{{ game.name }}</h3>

        <button 
          (click)="viewGame(game)" 
          type="button" 
          class="mb-4 inline-block shadow-lg px-6 py-2 border border-transparent text-sm leading-6 font-bold rounded-full text-white bg-gradient-to-r from-indigo-600 to-blue-500 hover:from-indigo-500 hover:to-blue-400 focus:outline-none transition duration-150 ease-in-out cursor-pointer focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
        >
          Ver más
        </button>

        <p class="text-gray-600">{{ game.description }}</p>
      </div>

      <!-- Right section (Image) -->
      <div class="w-full md:w-64 h-48 md:h-full flex-shrink-0">
        <img [src]="game.imageUrl" [alt]="game.name" class="w-full h-full object-cover rounded-r-xl">
      </div>
    </div>
  </div>
</section>
